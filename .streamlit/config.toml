[server]
# Listen on all interfaces inside the container
address = "0.0.0.0"
port = 8501

# Disable file watcher in production (saves resources)
runOnSave = false
fileWatcherType = "none"

# Trust the X-Forwarded-* headers set by nginx
enableCORS = false
enableXsrfProtection = true

# Increase upload limit to match nginx client_max_body_size
maxUploadSize = 100

# Headless mode: no browser auto-open, no "Welcome to Streamlit" banner
headless = true

[browser]
# The URL users reach the app from (shown in the "Network URL" log line)
serverAddress = "localhost"
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#2563eb"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"
font = "sans serif"

[logger]
level = "warning"
messageFormat = "%(asctime)s %(levelname)s %(name)s: %(message)s"
